paths:
  /api/v1/users/register:
    post:
      summary: Register a new user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Register"
      responses:
        "201":
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Registration successful
                  data:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: Conflict - Email or User already exists

  /api/v1/users/login:
    post:
      summary: Login user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Login successful
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        description: JWT Token
                      user:
                        $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Unauthorized - User not found or Invalid password

  /api/v1/users/me:
    get:
      summary: Get current user profile
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User profile retrieved successfully
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized - Invalid or missing token

  /api/v1/events:
    get:
      summary: Get all events
      tags: [Events]
      responses:
        "200":
          description: Events retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Events retrieved successfully
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Event"
        "500":
          description: Internal Server Error
    post:
      summary: Create a new event
      tags: [Events]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEvent"
      responses:
        "201":
          description: Event created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Event created successfully
                  data:
                    $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          description: Internal Server Error

  /api/v1/transactions:
    post:
      summary: Book a ticket
      tags: [Transactions]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Booking"
      responses:
        "201":
          description: Booking successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Booking successful. Please pay before expiration.
                  data:
                    $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          description: Not Found - Ticket not found
        "409":
          description: Conflict - Ticket sold out or unavailable

components:
  schemas:
    Register:
      type: object
      required:
        - email
        - username
        - password
      properties:
        email:
          type: string
          format: email
          example: john.doe@example.com
        username:
          type: string
          minLength: 3
          example: johndoe
        password:
          type: string
          minLength: 6
          example: mysecurepassword

    Login:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: john.doe@example.com
        password:
          type: string
          minLength: 1
          example: mysecurepassword

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: johndoe
        email:
          type: string
          format: email
          example: john.doe@example.com
        role:
          type: string
          example: USER
        createdAt:
          type: string
          format: date-time

    CreateEvent:
      type: object
      required:
        - name
        - location
        - startDate
        - endDate
        - tickets
      properties:
        name:
          type: string
          minLength: 3
          example: Tech Conference 2024
        description:
          type: string
          example: An awesome tech conference
        location:
          type: string
          minLength: 3
          example: Jakarta Convention Center
        startDate:
          type: string
          format: date-time
          example: 2024-12-01T09:00:00Z
        endDate:
          type: string
          format: date-time
          example: 2024-12-03T18:00:00Z
        tickets:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - ticketType
              - price
              - quota
            properties:
              ticketType:
                type: string
                minLength: 1
                example: VIP
              price:
                type: number
                minimum: 0
                example: 1500000
              quota:
                type: number
                minimum: 1
                example: 100

    Event:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Tech Conference 2024
        description:
          type: string
          example: An awesome tech conference
        location:
          type: string
          example: Jakarta Convention Center
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    Booking:
      type: object
      required:
        - ticketId
        - quantity
      properties:
        ticketId:
          type: integer
          minimum: 1
          example: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 5
          example: 2

    Transaction:
      type: object
      properties:
        id:
          type: integer
          example: 1
        userId:
          type: integer
          example: 1
        ticketId:
          type: integer
          example: 1
        quantity:
          type: integer
          example: 2
        totalPrice:
          type: number
          example: 3000000
        status:
          type: string
          example: PENDING
        paymentExpiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

  responses:
    ValidationError:
      description: Validation Error
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: Validation Error
              errors:
                type: object
                description: Detailed validation errors from Zod
